<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuocGamer Tienda de Artículos y Juegos Digitales</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark">
    <header>
        <div class="container bg-dark py-2">
            <h3 class="text-white">Duoc Gamer</h3>
        </div>
    </header>
    
    <main class="container my-5">
        <section class="row justify-content-center">
            <div class="col-md-7">
                <article class="card shadow card-transparente border-0 rounded-4">
                    <div class="card-body p-4">
                        
                        <div id="paso-login">
                            <h1 class="text-center mb-4 text-dark fw-bold">Iniciar Sesión</h1>
                            
                            <div class="mb-3">
                                <label for="usuario" class="form-label fw-semibold">Nombre de Usuario</label>
                                <input type="text" id="usuario" class="form-control" placeholder="Escribe tu usuario">
                            </div>

                            <div class="mb-3">
                                <label for="contrasena" class="form-label fw-semibold">Contraseña (PIN numérico)</label>
                                <input type="password" id="contrasena" class="form-control" placeholder="Escribe tu contraseña">
                            </div>

                            <button class="btn btn-primary" onclick="validarUsuario()">
                                Iniciar Sesión
                            </button>
                            <button class="btn btn-secondary" onclick="btnRegistrar()">
                                Registrarse
                            </button>
                        </div>
                        
                        <div id="Registro-Usuario" class="d-none">   
                            <h1 class="text-center mb-4 text-dark fw-bold">Registrar Usuario</h1>
                            
                            <div class="mb-3">
                                <label for="Nombre" class="form-label fw-semibold">Nombre</label>
                                <input type="text" id="Nombre" class="form-control" placeholder="Alvaro">
                            </div>
                            <div class="mb-3">
                                <label for="Apellido" class="form-label fw-semibold">Apellido</label>
                                <input type="text" id="Apellido" class="form-control" placeholder="Chirinos">
                            </div>
                            <div class="mb-3">
                                <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento</label>
                                <input type="date" id="fechaNacimiento" class="form-control">
                            </div>

                            <h3 class="mb-4 text-dark fw-bold">Información de Domicilio</h3>
                            
                            <div class="mb-3">
                                <label for="direccion" class="form-label fw-semibold">Dirección</label>
                                <input type="text" id="direccion" class="form-control" placeholder="Av General Mackenna 0000">
                            </div>
                            <div class="mb-3">
                                <label for="region" class="form-label fw-semibold">Región</label>
                                <select id="region" class="form-select">
                                    <option value="" selected disabled>Selecciona tu región...</option>
                                    <option value="metropolitana">Metropolitana</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="comuna" class="form-label fw-semibold">Comuna</label>
                                <select id="comuna" class="form-select">
                                    <option value="" selected disabled>Selecciona tu región...</option>
                                    <option value="Santiago">Santiago</option>
                                    <option value="LaReina">La Reina</option>
                                    <option value="PuenteAlto">Puente Alto</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label fw-semibold">Teléfono</label>
                                <input type="text" id="telefono" class="form-control" placeholder="56900000000">
                            </div>
                            <div class="mb-3">
                                <label for="regUsuario" class="form-label fw-semibold">Registre Nombre de usuario</label>
                                <input type="text" id="regUsuario" class="form-control" placeholder="Escribe tu usuario">
                            </div>
                            <div class="mb-3">
                                <label for="regContrasena" class="form-label fw-semibold">Contraseña (PIN numérico)</label>
                                <input type="password" id="regContrasena" class="form-control" placeholder="Escribe tu contraseña">
                            </div>
                            <div class="mb-3">
                                <label for="confirmarContrasena" class="form-label fw-semibold">Confirmar Contraseña (PIN numérico)</label>
                                <input type="password" id="confirmarContrasena" class="form-control" placeholder="Repite tu contraseña">
                            </div>
                            <button class="btn btn-secondary" onclick="registrarUsuario()">
                                Guardar Usuario
                            </button>
                        </div>

                        <div id="paso-productos" class="d-none"></div>
                        <div id="resultado" class="mt-4"></div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="bg-black text-white text-center py-3">
        <p class="mb-0">Duoc Evaluación Formativa 1 | Desarrollado por Alvaro Chirinos</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
